name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  UV_VERSION: "0.5.4"
  EVAL_OFFLINE: "1"

jobs:
  lint-and-test:
    name: lint + typecheck + tests + smoke eval
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: uv sync (frozen)
        run: uv sync --frozen --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy strict
        run: uv run mypy --strict src

      - name: Pytest with coverage gate
        run: uv run pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Smoke eval (offline)
        run: uv run python -m mcp_financial_data.evals.harness --smoke --offline

      - name: Build server (smoke import)
        run: uv run python -c "from mcp_financial_data.server import build_app; build_app()"

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-runs-${{ github.sha }}
          path: evals/runs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Post eval delta as PR comment
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python .github/scripts/post_eval_delta.py
