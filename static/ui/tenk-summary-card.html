<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TenK Summary Card</title>
    <style>
      .tk-card { font-family: system-ui, sans-serif; max-width: 42rem; margin: 0 auto; }
      .tk-header h1 { margin: 0 0 0.25rem; font-size: 1.25rem; }
      .tk-header p { margin: 0; color: #555; font-size: 0.875rem; }
      .tk-facts ul { list-style: none; padding: 0; }
      .tk-facts li { margin-bottom: 1rem; border-bottom: 1px solid #eee; padding-bottom: 0.75rem; }
      .tk-pills { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.35rem; }
      .tk-pill {
        font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 999px;
        background: #e8f0fe; color: #1a56db; text-decoration: none;
      }
      .tk-footer { display: flex; flex-wrap: wrap; gap: 0.75rem; font-size: 0.75rem; color: #666; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <div id="tenk-summary-card-root"></div>
    <script src="./tenk-summary-card.bundle.js"></script>
  </body>
</html>
