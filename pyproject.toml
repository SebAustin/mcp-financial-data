[project]
name = "mcp-financial-data"
version = "0.0.1"
description = "MCP server for SEC EDGAR + FRED + Polygon with OAuth 2.1, Claude-powered 10-K extraction, and MCP Apps inline UI."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sebastien Henry", email = "sebastien.henry@example.com" }]
requires-python = ">=3.12,<3.13"
keywords = ["mcp", "anthropic", "claude", "sec-edgar", "fred", "polygon", "fsi", "10-k"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "mcp>=1.2,<2",
    "fastmcp>=2.0,<4",
    "anthropic>=0.40,<1",
    "fastapi>=0.115,<0.200",
    "httpx>=0.28,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "structlog>=24.4,<26",
    "python-dotenv>=1.0,<2",
    "tenacity>=9.0,<10",
    "authlib>=1.3,<2",
    "PyJWT[crypto]>=2.9,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7,<1",
    "mypy>=1.13,<3",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5.0,<8",
    "respx>=0.21,<1",
    "anyio>=4.6,<5",
    "types-requests>=2.32,<3",
    "pre-commit>=4.0,<5",
]

[project.urls]
Homepage = "https://github.com/SebAustin/mcp-financial-data"
Issues = "https://github.com/SebAustin/mcp-financial-data/issues"

[project.scripts]
mcp-financial-data = "mcp_financial_data.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_financial_data"]

[dependency-groups]
dev = [
    "ruff>=0.7,<1",
    "mypy>=1.13,<3",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5.0,<8",
    "respx>=0.21,<1",
    "anyio>=4.6,<5",
    "pre-commit>=4.0,<5",
]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "T20", # flake8-print (no print() in lib code)
    "ASYNC",
    "ANN", # type annotations
    "PT",  # pytest style
    "S",   # bandit (security)
    "TID", # tidy imports
]
ignore = [
    "ANN401",  # allow Any in narrow cases
    "S101",    # asserts allowed in tests (overridden below)
]

[tool.ruff.lint.per-file-ignores]
# Pydantic ValidationError is a subclass of ValueError; catching ValueError
# in tests is idiomatic. PT011 enforces a narrower regex but adds noise here.
"tests/**" = ["S101", "ANN", "T20", "PT011"]
"evals/**" = ["T20"]
".github/scripts/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_financial_data"]

# ---------------------------------------------------------------------------
# Mypy (strict)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["fastmcp.*", "mcp.*", "respx.*", "authlib.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "integration: real-network integration tests (skipped by default)",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "-m", "not integration",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:authlib.*",
    "ignore::DeprecationWarning:fastmcp.*",
    "ignore:authlib.jose:Warning",
    # FastMCP / asyncio leave sockets and event loops in module-level
    # caches that get GC'd between tests; these are not bugs in our code.
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::ResourceWarning",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["mcp_financial_data"]
omit = ["src/mcp_financial_data/__main__.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "@overload",
]
show_missing = true
skip_empty = true
fail_under = 85
